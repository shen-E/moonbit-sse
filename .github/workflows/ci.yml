name: MoonBit check and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install MoonBit Toolchain (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit Toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify toolchain
        run: |
          moon version --all
          moon update

      - name: Verify Code Formatting
        run: moon fmt --check

      - name: Type Check (all targets, no warnings)
        run: moon check --target all --deny-warn

      - name: Run Tests (all targets, no warnings)
        run: moon test --target all --deny-warn

      - name: Check Public Interfaces
        shell: bash
        run: |
          moon info
          git diff --ignore-space-at-eol --exit-code

      - name: Validate CLI Executable
        run: moon run cmd/sse_cli
